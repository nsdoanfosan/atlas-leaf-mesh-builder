name: Agent live baseline verification

on:
  push:
    branches:
      - agent/current-transaction-live-baseline

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile changed files
        run: >-
          python -m py_compile
          addons/atlas_leaf_mesh_builder/current_transaction_adoption.py
          tests/test_current_transaction_adoption.py
      - name: Run current transaction tests
        run: python tests/test_current_transaction_adoption.py
      - name: Run SpeedTree XML tests
        run: python tests/test_speedtree_xml.py
      - name: Run generator ownership tests
        run: python tests/test_generator_slot_ownership.py
      - name: Run transaction tests
        run: python tests/test_speedtree_transaction.py
