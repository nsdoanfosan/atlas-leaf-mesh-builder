name: Producer CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: producer-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  producer-tests:
    name: Windows / Python 3.10.11
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      PYTHONUTF8: "1"
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up supported Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Run complete producer validation
        shell: powershell
        run: .\scripts\run_ci.ps1 -InstallDependencies
